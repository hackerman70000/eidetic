[project]
name = "eidetic"
version = "0.1.0"
description = "Training data extraction and membership inference for diffusion models (Carlini et al. 2023)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bartlomiej Dmitruk", email = "bartlomiej.dmitruk@isec.pl" }]
keywords = ["diffusion", "extraction", "membership-inference", "lira", "memorization", "privacy"]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pillow>=10.2",
    "tqdm>=4.66",
    "typer>=0.12",
    "loguru>=0.7",
]

[project.optional-dependencies]
diffusion = [
    "diffusers>=0.27",
    "transformers>=4.50",
    "accelerate>=0.30",
    "datasets>=2.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
eidetic = "eidetic.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eidetic"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415"]
"experiments/*" = ["T201", "PLC0415", "PLR0912", "PLR0915"]
"src/eidetic/cli/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true
files = ["src/eidetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
